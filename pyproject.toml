[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-retry-proxy"
version = "0.2.0"
description = "Multi-provider HTTP retry proxy for the Claude API with tier-based routing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [
    {name = "wsong"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=38.0",
]

[project.scripts]
claude-retry-proxy = "claude_retry_proxy.cli:main"
claude-retry-proxy-server = "claude_retry_proxy.server:main"

[project.urls]
Homepage = "https://github.com/anthropics/claude-code"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_retry_proxy = ["admin.html", "config-template.json"]
