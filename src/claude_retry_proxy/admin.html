<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Retry Proxy - Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #4fc3f7; margin-bottom: 1rem; }
        h2 { color: #81c784; margin: 1.5rem 0 0.5rem; }
        .card { background: #16213e; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
        .tier-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem; }
        .tier-label { width: 80px; font-weight: bold; text-transform: uppercase; }
        .tier-label.haiku { color: #4fc3f7; }
        .tier-label.sonnet { color: #81c784; }
        .tier-label.opus { color: #ffb74d; }
        select { background: #0f3460; border: 1px solid #4fc3f7; color: #eee; padding: 0.5rem; border-radius: 4px; flex: 1; }
        select:disabled { background: #3a3a4a; color: #9a9a9a; border: 1px solid #555; cursor: not-allowed; }
        .tier-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid #444; }
        .tier-header span:not(.tier-label) { flex: 1; color: #9a9a9a; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; }
        button { background: #4fc3f7; color: #1a1a2e; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 0.5rem; }
        button:hover { background: #81d4fa; }
        button.secondary { background: #455a64; color: #eee; }
        button.secondary:hover { background: #607d8b; }
        button:disabled,
        button.secondary:disabled,
        button.secondary:disabled:hover { background: #3a3a4a; color: #9a9a9a; cursor: not-allowed; }
        .status { padding: 1rem; border-radius: 4px; margin-top: 1rem; display: none; }
        .status.success { background: #1b5e20; display: block; }
        .status.error { background: #b71c1c; display: block; }
        .status.pending { background: #0f3460; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Claude Retry Proxy</h1>
        <div class="card">
            <h2>Tier Configuration</h2>
            <div class="tier-header">
                <span class="tier-label"></span>
                <span>Provider</span>
                <span>Model</span>
                <span>Key</span>
            </div>
            <div id="tiers-container"></div>
            <div style="margin-top: 1.5rem;">
                <button id="apply-btn" onclick="saveConfig()">Apply Config</button>
                <button id="reload-btn" class="secondary" onclick="reloadConfig()">Reload Providers</button>
            </div>
            <div id="status" class="status"></div>
        </div>
    </div>

    <script>
        const TIERS = ['opus', 'sonnet', 'haiku'];
        let config = null;
        let providers = [];
        let providerModes = {};
        let providerKeys = {};
        // Handle for the 1 Hz swap-status poll; null when no press is pending.
        let swapPollHandle = null;
        // Set once a press has written its terminal status line, so a poll
        // whose response was generated while swapping was still true cannot
        // resolve late and overwrite that line.
        let swapSettled = false;
        // Each attach takes its own generation, and the watcher's callback
        // compares the one it captured, so a late response from a stale
        // watcher can only bail out — it can never settle the current one.
        let attachGeneration = 0;
        let attachPollHandle = null;
        let attachPollFailures = 0;
        let statusTimer = null;

        // Numeric-only rendering of the swap detail the server returns.
        // Never interpolate a raw response string here.
        function swapDetail(result) {
            if (!result || typeof result.waited_s !== 'number') {
                return '';
            }
            const inflight = (typeof result.inflight_at_swap === 'number')
                ? result.inflight_at_swap : 0;
            return ' (waited ' + result.waited_s.toFixed(1) + 's, ' +
                inflight + ' in-flight at press)';
        }

        // The 409 refusal carries the standard Anthropic envelope, so `error`
        // is an object; the older admin refusals carry a plain string. Render
        // the message for both shapes rather than "[object Object]".
        function errorText(result) {
            const err = result && result.error;
            if (err && typeof err === 'object') {
                return err.message || 'Unknown error';
            }
            return err || 'Unknown error';
        }

        async function loadProviderModes() {
            try {
                const resp = await fetch('/admin/api/providers-detail');
                if (resp.ok) {
                    const data = await resp.json();
                    providerModes = (data && data.providers) || {};
                    providerKeys = {};
                    for (const [p, d] of Object.entries(providerModes)) {
                        providerKeys[p] = (d && d.keys) || [];
                    }
                }
            } catch (e) {
                providerModes = {};
                providerKeys = {};
            }
        }

        async function loadConfig() {
            try {
                const [configResp, providersResp] = await Promise.all([
                    fetch('/admin/api/config'),
                    fetch('/admin/api/providers')
                ]);
                config = await configResp.json();
                const providersData = await providersResp.json();
                providers = providersData.providers || [];
                // Optional endpoint — a failing fetch must not brick the page.
                await loadProviderModes();
                renderTiers();
            } catch (e) {
                showStatus('error', 'Failed to load config: ' + e.message);
            }
            checkInFlightSwapOnLoad();
        }

        function renderTiers() {
            const container = document.getElementById('tiers-container');
            container.innerHTML = '';
            TIERS.forEach(tier => {
                const tierConfig = config.tiers[tier] || { provider: '', model: '' };
                const div = document.createElement('div');
                div.className = 'tier-row';
                div.innerHTML = `
                    <span class="tier-label ${tier}">${tier}</span>
                    <select id="${tier}-provider" onchange="populateModels('${tier}'); populateKeys('${tier}')">
                    </select>
                    <select id="${tier}-model">
                    </select>
                    <select id="${tier}-key">
                    </select>
                `;
                container.appendChild(div);

                // Populate providers dropdown
                const providerSelect = document.getElementById(`${tier}-provider`);
                providers.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p;
                    const mode = providerModes[p] && providerModes[p].mode;
                    // Label shows mode only when it differs from the anthropic
                    // default; value stays the raw provider name so switch
                    // validation matches. textContent only (XSS guard).
                    opt.textContent = (mode && mode !== 'anthropic') ? `${p} (${mode})` : p;
                    providerSelect.appendChild(opt);
                });
                providerSelect.value = tierConfig.provider || '';

                // Populate models from selected provider
                populateModels(tier);
                // Populate keys from selected provider (initial render — the
                // onchange handles provider switches)
                populateKeys(tier);
            });
        }

        function populateModels(tier) {
            const provider = document.getElementById(`${tier}-provider`).value;
            const models = config.models?.[provider] || [];
            const modelSelect = document.getElementById(`${tier}-model`);

            // Clear and rebuild options
            modelSelect.innerHTML = '';
            models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                modelSelect.appendChild(opt);
            });

            // Restore selection if the saved tier model exists in the list
            const savedModel = (config.tiers[tier] || {}).model;
            if (savedModel && models.includes(savedModel)) {
                modelSelect.value = savedModel;
            }
        }

        function populateKeys(tier) {
            const provider = document.getElementById(`${tier}-provider`).value;
            const keys = providerKeys[provider] || [];
            const keySelect = document.getElementById(`${tier}-key`);

            // Rebuild options (textContent only — XSS guard)
            keySelect.innerHTML = '';
            keys.forEach(k => {
                const opt = document.createElement('option');
                opt.value = k;
                opt.textContent = k;
                keySelect.appendChild(opt);
            });
            // Single-key (or keyless) providers get a disabled grey select
            keySelect.disabled = (keys.length <= 1);

            // Restore the saved key selection when it still exists; otherwise
            // the first option stays selected (first-key default).
            const savedKey = (config.tiers[tier] || {}).key;
            if (savedKey && keys.includes(savedKey)) {
                keySelect.value = savedKey;
            }
        }

        async function saveConfig() {
            // The tier selects exist only after renderTiers() has run, and the
            // failing initial-load path never reaches it. Reading one would
            // throw above this function's try, surfacing as an unhandled
            // rejection with no status line at all.
            if (!document.getElementById(`${TIERS[0]}-provider`)) {
                showStatus('error', 'Failed to load config — reload the page', true);
                return;
            }
            // /providers-detail supplies the key NAMES. When that fetch fails the
            // row still renders, so the page looks normal — but populateKeys
            // builds no options and disables the select, and a disabled select
            // still reads "". The server maps "" to names[0] (the provider's
            // FIRST key), not to "unchanged", so pressing Apply would silently
            // re-point every multi-key tier and persist it. Reload Providers
            // does not re-fetch provider-detail, so only a full page reload
            // clears this state.
            for (const tier of TIERS) {
                // The element may be missing even when guard 1 passed: both
                // guards sit ABOVE saveConfig's try, so a null dereference here
                // rejects unhandled with no status line — the failure guard 1
                // removed, one row later. Checking the handle makes this guard
                // self-sufficient instead of relying on the haiku row standing
                // in for all nine selects; once this loop completes, the two
                // later loops' dereferences are safe by construction.
                const el = document.getElementById(`${tier}-provider`);
                if (!el) {
                    showStatus('error', 'Failed to load config — reload the page', true);
                    return;
                }
                const provider = el.value;
                if (provider && !(providerKeys[provider] || []).length) {
                    showStatus('error', 'The key list could not be loaded — '
                        + 'reload the page before applying', true);
                    return;
                }
            }
            const newConfig = {
                tiers: {}
            };
            TIERS.forEach(tier => {
                newConfig.tiers[tier] = {
                    provider: document.getElementById(`${tier}-provider`).value,
                    model: document.getElementById(`${tier}-model`).value,
                    key: document.getElementById(`${tier}-key`).value || ''
                };
            });

            // Validate
            for (const tier of TIERS) {
                if (!newConfig.tiers[tier].provider) {
                    showStatus('error', `Provider required for ${tier}`);
                    return;
                }
                if (!newConfig.tiers[tier].model) {
                    showStatus('error', `Model required for ${tier}`);
                    return;
                }
            }

            // The swap pauses new admissions and waits for in-flight work
            // (unbounded by design), so show live progress instead of an
            // apparently hung Apply. A prior handle is cleared first so a
            // second press cannot stack intervals.
            if (swapPollHandle !== null) {
                clearInterval(swapPollHandle);
            }
            swapSettled = false;
            setSwapControlsDisabled(true);
            showStatus('pending', swapWaitText(null, 'applying — '), true);
            swapPollHandle = setInterval(async () => {
                if (swapSettled) {
                    // The press already wrote its terminal line: bail out.
                    return;
                }
                try {
                    const resp = await fetch('/admin/api/swap-status');
                    if (!resp.ok) {
                        return;
                    }
                    const st = await resp.json();
                    if (swapSettled) {
                        // The press can write its terminal line while this
                        // poll response is in flight (the callback's top
                        // check ran before the awaits). Re-check here so a
                        // late response never repaints over that line.
                        return;
                    }
                    if (st.swapping && st.inflight > 0 && st.silence_s !== null) {
                        showStatus('pending', swapWaitText(st, 'applying — '), true);
                    }
                } catch (e) {
                    // Poll failures are cosmetic — never break the flow.
                }
            }, 1000);

            try {
                const resp = await fetch('/admin/api/switch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': window.location.origin
                    },
                    body: JSON.stringify(newConfig)
                });
                const result = await resp.json();
                swapSettled = true;
                if (resp.ok) {
                    showStatus('success', 'Configuration saved successfully' +
                        swapDetail(result));
                    config.tiers = newConfig.tiers;
                } else if (result && result.error && result.error.code === 'config_swap_in_progress') {
                    // Single-flight refusal: a swap this page did not press is in flight.
                    // Hand off to the attach watcher — the controls stay locked and its
                    // progress stays visible; the watcher re-renders the tier row on
                    // completion, so the operator re-enters their changes against a
                    // baseline that matches the server.
                    attachToInFlightSwap('a config swap is already in progress — ',
                        'the in-flight config swap completed — the tier list has been refreshed; make your changes again');
                } else {
                    showStatus('error', 'Error: ' + errorText(result));
                }
            } catch (e) {
                swapSettled = true;
                showStatus('error', 'Failed to save: ' + e.message);
            } finally {
                // Must run on reject too: a network-level failure rejects the
                // fetch promise, and a clear wired only into the resolve path
                // would leak the interval forever.
                clearInterval(swapPollHandle);
                swapPollHandle = null;
                // The 409 branch hands off to the attach watcher, which owns the locked
                // state until that swap ends; every other terminal path unlocks here.
                if (attachPollHandle === null) {
                    setSwapControlsDisabled(false);
                }
            }
        }

        async function reloadConfig() {
            // Same pending-apply treatment as saveConfig (see there).
            if (swapPollHandle !== null) {
                clearInterval(swapPollHandle);
            }
            swapSettled = false;
            setSwapControlsDisabled(true);
            showStatus('pending', swapWaitText(null, 'applying — '), true);
            swapPollHandle = setInterval(async () => {
                if (swapSettled) {
                    // The press already wrote its terminal line: bail out.
                    return;
                }
                try {
                    const resp = await fetch('/admin/api/swap-status');
                    if (!resp.ok) {
                        return;
                    }
                    const st = await resp.json();
                    if (swapSettled) {
                        // The press can write its terminal line while this
                        // poll response is in flight (the callback's top
                        // check ran before the awaits). Re-check here so a
                        // late response never repaints over that line.
                        return;
                    }
                    if (st.swapping && st.inflight > 0 && st.silence_s !== null) {
                        showStatus('pending', swapWaitText(st, 'applying — '), true);
                    }
                } catch (e) {
                    // Poll failures are cosmetic — never break the flow.
                }
            }, 1000);

            // Set when a stale-refusal's tier re-read FAILED: the row may still be one
            // swap behind, so the finally below must not hand back an actionable
            // surface. Mirrors the attach path's failed-re-read contract.
            let reloadStaleUnresolved = false;
            try {
                const resp = await fetch('/admin/api/reload', {
                    method: 'POST',
                    headers: { 'Origin': window.location.origin }
                });
                const result = await resp.json();
                swapSettled = true;
                if (resp.ok) {
                    config = result.config;
                    renderTiers();
                    showStatus('success', 'Providers reloaded from models.json' +
                        swapDetail(result));
                } else if (result && result.error && result.error.code === 'config_swap_in_progress') {
                    // Single-flight refusal: a swap this page did not press is in flight.
                    // Hand off to the attach watcher — the controls stay locked and its
                    // progress stays visible; the watcher re-renders the tier row on
                    // completion, so the operator re-enters their changes against a
                    // baseline that matches the server.
                    attachToInFlightSwap('a config swap is already in progress — ',
                        'the in-flight config swap completed — press Reload Providers again to refresh');
                } else if (result && result.error && result.error.code === 'config_reload_stale') {
                    // A concurrent switch completed while this reload's candidate was
                    // being prepared, so the tier row on screen predates it. Re-read it
                    // before unlocking, or the next Apply writes that pre-switch baseline
                    // back — the same hazard the attach path closes.
                    const refreshed = await refreshTiersFromServer();
                    if (refreshed) {
                        showStatus('error', 'The configuration changed while reloading — the ' +
                            'tier list has been refreshed; press Reload Providers again');
                    } else {
                        reloadStaleUnresolved = true;
                        showStatus('pending', 'The configuration changed while reloading, and ' +
                            'the tier list could not be re-read — reload this page before applying',
                            true);
                    }
                } else {
                    showStatus('error', 'Error: ' + errorText(result));
                }
            } catch (e) {
                swapSettled = true;
                showStatus('error', 'Failed to reload providers: ' + e.message);
            } finally {
                clearInterval(swapPollHandle);
                swapPollHandle = null;
                // The 409 branch hands off to the attach watcher, which owns the locked
                // state until that swap ends; every other terminal path unlocks here.
                if (attachPollHandle === null && !reloadStaleUnresolved) {
                    setSwapControlsDisabled(false);
                }
            }
        }

        function showStatus(type, message, sticky) {
            const el = document.getElementById('status');
            if (statusTimer !== null) { clearTimeout(statusTimer); statusTimer = null; }
            el.className = 'status ' + type;
            el.textContent = message;
            if (!sticky) {
                statusTimer = setTimeout(() => { el.className = 'status'; statusTimer = null; }, 5000);
            }
        }

        // Live pending line from a swap-status payload. prefix differs by context:
        // 'applying — ' (a press) vs 'config swap in progress — ' (a swap this
        // page did not press). Falls back to the base text when no detail is
        // available (initial paint, or a transient zero in-flight reading).
        // Every numeric field is guarded before interpolation — including
        // budget_s, whose absence must fall back rather than render "… / null s…".
        function swapWaitText(st, prefix) {
            const tail = ' (no need to refresh — this page follows the switch)';
            if (st && typeof st.inflight === 'number' && st.inflight > 0 &&
                typeof st.silence_s === 'number' && typeof st.budget_s === 'number') {
                return prefix + 'waiting for ' + st.inflight + ' in-flight request(s), silence ' +
                    Math.floor(st.silence_s) + 's / ' + st.budget_s + 's…' + tail;
            }
            return prefix + 'waiting for in-flight requests…' + tail;
        }

        // Lock the entire switch surface — both buttons AND all nine tier
        // selects — for as long as a swap is in play. Locking the selects is
        // what makes the completion re-render safe: no edit can be in flight.
        function setSwapControlsDisabled(disabled) {
            for (const id of ['apply-btn', 'reload-btn']) {
                const el = document.getElementById(id);
                if (el) { el.disabled = disabled; }
            }
            TIERS.forEach(tier => {
                for (const field of ['provider', 'model', 'key']) {
                    const el = document.getElementById(tier + '-' + field);
                    if (!el) { continue; }
                    if (disabled) {
                        el.disabled = true;
                    } else if (field === 'key') {
                        // Unlocking must RESTORE populateKeys' rule, not blanket-
                        // enable: a single-key provider's key select stays disabled.
                        const prov = document.getElementById(tier + '-provider');
                        const keys = providerKeys[(prov && prov.value) || ''] || [];
                        el.disabled = (keys.length <= 1);
                    } else {
                        el.disabled = false;
                    }
                }
            });
        }

        // Re-read the tier row from the server. Called on attach completion: the
        // document this page loaded may predate the swap that just installed.
        // Returns true only when the row was actually re-rendered — the caller
        // must NOT unlock on a failed read, or the operator re-enters the very
        // pre-swap baseline this re-render exists to replace.
        async function refreshTiersFromServer() {
            try {
                const resp = await fetch('/admin/api/config');
                if (!resp.ok) { return false; }
                config = await resp.json();
                renderTiers();
                return true;
            } catch (e) {
                return false;
            }
        }

        // Watch a swap this page did not press — detected on load, or refused 409
        // on a press. The controls stay locked and the pending line repaints at
        // 1 Hz until the server reports swapping false. Idempotent: a second call
        // is a no-op. Completion RE-RENDERS the tier row from the server: the
        // document this page loaded may predate the swap that just installed, so a
        // press from the values still on screen would write back a pre-swap
        // baseline (the same hazard the 409 refusal used to prevent by refusing).
        function attachToInFlightSwap(prefix, doneText) {
            if (attachPollHandle !== null) {
                return;
            }
            const myGeneration = ++attachGeneration;
            let settled = false;
            attachPollFailures = 0;
            setSwapControlsDisabled(true);
            showStatus('pending', swapWaitText(null, prefix), true);
            attachPollHandle = setInterval(async () => {
                if (myGeneration !== attachGeneration) {
                    // A later attach owns the page now: only ever bail out.
                    return;
                }
                try {
                    const resp = await fetch('/admin/api/swap-status');
                    if (!resp.ok) {
                        noteAttachPollFailure(prefix);
                        return;
                    }
                    const st = await resp.json();
                    if (myGeneration !== attachGeneration) {
                        // Post-await re-check: a late response from a stale
                        // watcher must never repaint over the terminal line.
                        return;
                    }
                    attachPollFailures = 0;
                    if (settled) {
                        // A sibling tick of THIS attach already settled: its
                        // terminal line stands, and the interval is cleared so
                        // nothing would correct a repaint here.
                        return;
                    }
                    if (!st.swapping) {
                        // Per-attach settledness. The generation guard covers a
                        // NEWER attach; it cannot cover a second tick of THIS one,
                        // and the interval deliberately survives the await below
                        // (so the poll-failure signal keeps working), so without
                        // this flag two ticks would both settle and the later
                        // terminal line would win regardless of which re-read was
                        // truthful. Cleared implicitly: a new attach makes a new
                        // closure.
                        settled = true;
                        const refreshed = await refreshTiersFromServer();
                        clearInterval(attachPollHandle);
                        attachPollHandle = null;
                        if (refreshed) {
                            setSwapControlsDisabled(false);
                            showStatus('success', doneText);
                        } else {
                            // The tier row could not be re-read, so it may
                            // still be one swap behind. Stay locked and say
                            // so — unlocking here would let a press write
                            // that stale baseline back over the swap.
                            showStatus('pending', prefix +
                                'the config could not be re-read — reload this page before applying', true);
                        }
                        return;
                    }
                    showStatus('pending', swapWaitText(st, prefix), true);
                } catch (e) {
                    noteAttachPollFailure(prefix);
                }
            }, 1000);
        }

        // A poll failure is NOT cosmetic on this path, unlike in the press path:
        // a successful `swapping: false` read is the watcher's only exit and
        // nothing else unlocks the controls, so a persistent failure would leave
        // the page locked while still narrating progress. After 5 consecutive
        // failures (~5 s) the line says so and names the way out. Retrying
        // continues, and the controls stay locked — an unreadable status is not
        // evidence that no swap is running.
        function noteAttachPollFailure(prefix) {
            attachPollFailures += 1;
            if (attachPollFailures === 5) {
                showStatus('pending', prefix +
                    'cannot reach the proxy — the switch may still be running; ' +
                    'reload this page when it is back', true);
            }
        }

        // A page loaded while a swap is in flight must say so immediately, not
        // only after the operator presses Apply and collects a 409.
        async function checkInFlightSwapOnLoad() {
            if (swapPollHandle !== null || attachPollHandle !== null) {
                return;
            }
            try {
                const resp = await fetch('/admin/api/swap-status');
                if (!resp.ok) {
                    return;
                }
                const st = await resp.json();
                // Three conditions, and the third is the load-bearing one: the
                // handler checks catch a press that is RUNNING, while swapSettled
                // catches one that started AND finished inside this one-shot's
                // fetch→parse window — otherwise a swap this very page performed
                // would be re-attached, overwriting its own success line and
                // re-locking the controls. The pre-fetch handler check is
                // unreachable from today's single call site (`loadConfig` runs once,
                // before any press can exist) and is kept only as a cheap guard
                // against a future second caller.
                if (swapPollHandle !== null || attachPollHandle !== null || swapSettled) {
                    return;
                }
                if (st.swapping) {
                    attachToInFlightSwap('config swap in progress — ',
                        'the in-flight config swap completed — the tier list has been refreshed');
                } else {
                    // The drain may have completed between loadConfig's config read and
                    // this read, which would leave the row one swap behind. Re-read it —
                    // but gate on the result: a failed re-read must NOT leave a
                    // possibly-pre-swap row unlocked and pressable, because
                    // /admin/api/switch has no staleness guard and the next Apply would
                    // write that baseline back. Same discipline as the reload-stale and
                    // attach-completion sites.
                    const refreshed = await refreshTiersFromServer();
                    if (!refreshed) {
                        setSwapControlsDisabled(true);
                        showStatus('pending', 'the tier list could not be re-read — ' +
                            'reload this page before applying', true);
                        return;
                    }
                    // renderTiers() rebuilt the selects as fresh enabled nodes, so a press
                    // that started inside that fetch has just had its lock dropped.
                    // Re-assert the guards now, after the await, or the load path is the
                    // only re-render site that can unlock a press.
                    if (swapPollHandle !== null || attachPollHandle !== null || swapSettled) {
                        setSwapControlsDisabled(true);
                    }
                }
            } catch (e) {
                // Cosmetic — a failed check must not brick the page.
            }
        }

        // Load config on page load
        loadConfig();
    </script>
</body>
</html>
